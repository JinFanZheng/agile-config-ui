# agile-config-ui 生产反代配置（envsubst 模板，非可直接 nginx -t 的最终配置）
#
# 渲染方式：容器启动时执行
#   envsubst '${BACKEND}' < default.conf.template > default.conf
# 后端地址来自环境变量 BACKEND（默认 http://backend:5000，见 Dockerfile）。
# 注意：envsubst 必须显式列出变量清单——若裸跑 envsubst，nginx 自身的
# $host / $remote_addr / $proxy_add_x_forwarded_for 也会被替换成空串。
#
# 部署契约（docs/AGENT_HANDOFF.md §7，ITER-08 RG-3 冻结）：
# 服务端 API 无统一前缀且未开 CORS，前端按控制器路径前缀同源反代；
# 前缀清单 = vite.config.ts 的 API_PREFIXES + /RemoteServerProxy（ITER-06 运维代理）。
#
# 大小写策略（稳妥方案）：nginx 的 prefix location 是字节级大小写敏感匹配，
# 而前端两种 casing 并存（登录走小写 /admin/jwt/login，管理走 /Admin/*），
# 逐条罗列大小写两套共 28 条 location 极易与前缀清单漂移；
# 故用单条 ~* 不区分大小写的正则 location 一次覆盖（PCRE ASCII 大小写
# 不敏感匹配，行为确定、跨平台一致），并以 (/|$) 锚定前缀边界——
# SPA 路由（/apps、/users、/roles 等）刷新直访不会被误代理到后端。
# 改前缀清单时须同步 vite.config.ts 的 API_PREFIXES 与本文件。

server {
    listen 80;
    server_name _;

    # 静态产物由 Dockerfile 从构建阶段复制到 /usr/share/nginx/html
    root  /usr/share/nginx/html;
    index index.html;

    # 文本响应显式 UTF-8（llms.txt 等中文纯文本；不带 charset 时浏览器按本地编码猜解会乱码）
    charset utf-8;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # API 反代：正则不区分大小写，一次覆盖大小写两套
    location ~* ^/(app|config|admin|user|role|servernode|service|syslog|sso|report|home|remoteop|remoteserverproxy)(/|$) {
        # envsubst 渲染后为字面量地址（如 http://backend:5000），
        # 启动期解析，无需 resolver
        proxy_pass ${BACKEND};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Vite 产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback：前端路由（/apps/xxx/config 等）刷新直访回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
